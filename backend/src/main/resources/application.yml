server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: codepilot-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/codepilot}
    username: ${SPRING_DATASOURCE_USERNAME:codepilot}
    password: ${SPRING_DATASOURCE_PASSWORD:codepilot}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate neither validates nor generates DDL from entities.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          ssl:
            enable: ${MAIL_SMTP_SSL:false}
          # Without these, JavaMail's default is no timeout at all -- if the SMTP host is
          # unreachable or the port is blocked outbound (seen on some PaaS providers), the
          # register/resend-verification request thread hangs indefinitely instead of the
          # graceful failure EmailService is already written to handle (see its sendVerificationEmail
          # javadoc). 8s is generous for a real SMTP handshake and short enough that a blocked
          # port fails fast.
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT_MS:8000}
          timeout: ${MAIL_SMTP_TIMEOUT_MS:8000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT_MS:8000}

  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    # Default MailHealthIndicator opens a live SMTP connection to the configured mail host on
    # every /actuator/health call -- with Gmail as MAIL_HOST that added ~2.5s of network latency
    # to every health check, which is exactly the kind of external dependency a liveness probe
    # should never have (a slow/unreachable Gmail would wrongly mark the whole app "unhealthy").
    mail:
      enabled: false
    # Every real Redis call site in this app (CacheService, RateLimiter, IdempotencyService)
    # deliberately fails open and keeps serving when Redis is unreachable -- that's the whole
    # point of caching/rate-limiting being backed by a fast, non-durable store. The default
    # RedisHealthIndicator disagreed: it dragged the AGGREGATE /actuator/health status to DOWN
    # the instant Redis blipped, even though every real endpoint kept returning 200s the whole
    # time (confirmed live: repository list/detail both stayed 200 with Redis stopped). Since
    # docker-compose's healthcheck (and any real orchestrator's) gates container restarts and
    # traffic routing on this endpoint, a transient Redis hiccup would otherwise take the whole
    # backend out of rotation for no functional reason.
    redis:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
  encryption:
    key: ${APP_ENCRYPTION_KEY:dev-only-insecure-encryption-key-change-me}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  github:
    oauth:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      redirect-uri: ${GITHUB_OAUTH_REDIRECT_URI:http://localhost:8080/api/auth/github/callback}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:no-reply@codepilot.local}
    # "smtp" (default) talks to whatever MAIL_HOST/PORT above point at -- Mailpit locally, a real
    # SMTP relay in prod. "resend"/"sendgrid" call those providers' HTTP APIs instead: several PaaS
    # providers (Railway among them) block outbound SMTP entirely on their free tier, and an HTTP
    # call over 443 sidesteps that. Resend's sandbox sender can only reach the Resend account's own
    # email until a domain is verified; SendGrid's free tier has no such restriction once its one
    # Single Sender address is verified (no domain needed there either) -- see EmailService.
    provider: ${MAIL_PROVIDER:smtp}
    resend:
      api-key: ${RESEND_API_KEY:}
      # Deliberately separate from MAIL_FROM (the SMTP sender) -- Resend 403s any "from" whose
      # domain isn't verified with them, and a real inbox address doesn't qualify just for being
      # real. Empty by default so EmailService falls back to Resend's own sandbox sender.
      from: ${RESEND_FROM_ADDRESS:}
    sendgrid:
      api-key: ${SENDGRID_API_KEY:}
      # Must be exactly the address verified as a Single Sender at
      # app.sendgrid.com/settings/sender_auth -- SendGrid 403s anything else, same reasoning as
      # Resend's from above.
      from: ${SENDGRID_FROM_ADDRESS:}
  verification:
    token-expiration-ms: ${VERIFICATION_TOKEN_EXPIRATION_MS:86400000}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    ai:
      limit: ${RATE_LIMIT_AI_LIMIT:20}
      window-seconds: ${RATE_LIMIT_AI_WINDOW_SECONDS:60}
    search:
      limit: ${RATE_LIMIT_SEARCH_LIMIT:60}
      window-seconds: ${RATE_LIMIT_SEARCH_WINDOW_SECONDS:60}
    indexing:
      limit: ${RATE_LIMIT_INDEXING_LIMIT:10}
      window-seconds: ${RATE_LIMIT_INDEXING_WINDOW_SECONDS:3600}
    webhook:
      limit: ${RATE_LIMIT_WEBHOOK_LIMIT:120}
      window-seconds: ${RATE_LIMIT_WEBHOOK_WINDOW_SECONDS:60}
    verify-code:
      limit: ${RATE_LIMIT_VERIFY_CODE_LIMIT:10}
      window-seconds: ${RATE_LIMIT_VERIFY_CODE_WINDOW_SECONDS:900}

logging:
  level:
    root: INFO
    com.codepilot: INFO
    org.hibernate.SQL: WARN
